<!-- Generic Filter Card (Tự động sinh UI từ config) -->
<section class="filter-card" (click)="toggleFilter()">
    <div class="filter-header">
        <span class="filter-title">
            <i class="bi" [ngClass]="isFilterOpen ? 'bi-caret-down-fill' : 'bi-caret-right-fill'"></i>
            Tìm kiếm
        </span>
    </div>

    <div class="filter-body" *ngIf="isFilterOpen" (click)="$event.stopPropagation()">
        <!-- Tự động sinh các field input từ config -->
        <div class="filter-row">
            <div class="filter-field" *ngFor="let field of config">
                <label *ngIf="field.type !== 'date-range'" [for]="field.key">{{ field.label }}</label>

                <!-- Render đúng loại input dựa trên field.type -->
                <ng-container [ngSwitch]="field.type">
                    <!-- Text Input -->
                    <input *ngSwitchCase="'text'" type="text" [id]="field.key" [placeholder]="'Nhập ' + field.label"
                        [(ngModel)]="filterValues[field.key]" />

                    <!-- Select Dropdown -->
                    <select *ngSwitchCase="'select'" [id]="field.key" [(ngModel)]="filterValues[field.key]"
                        [ngClass]="{'select-empty': filterValues[field.key] === ''}">
                        <option value="" disabled hidden>-- Chọn {{ field.label }} --</option>
                        <option *ngFor="let option of field.options" [value]="option.value">
                            {{ option.label }}
                        </option>
                    </select>

                    <!-- Multi Select Dropdown -->
                    <div *ngSwitchCase="'multi-select'" class="multi-select-wrapper">
                        <button type="button" class="multi-select-trigger"
                            (click)="toggleMultiSelectDropdown(field.key)"
                            [attr.aria-expanded]="openDropdownKey === field.key"
                            [attr.aria-controls]="field.key + '-panel'">
                            <span class="multi-select-text">{{ getMultiSelectDisplay(field) }}</span>
                            <i class="bi"
                                [ngClass]="openDropdownKey === field.key ? 'bi-caret-up-fill' : 'bi-caret-down-fill'"></i>
                        </button>

                        <div class="multi-select-panel" [id]="field.key + '-panel'"
                            *ngIf="openDropdownKey === field.key" (click)="$event.stopPropagation()">
                            <ng-container *ngIf="field.options && field.options.length > 0; else noOptions">
                                <ng-container *ngFor="let option of field.options; let index = index">
                                    <label class="multi-select-option"
                                        *ngIf="option && option.label && (option.label + '').trim() !== ''"
                                        [for]="field.key + '-' + index">
                                        <input type="checkbox" [id]="field.key + '-' + index"
                                            [checked]="isMultiSelectChecked(field.key, option.value)"
                                            (change)="onMultiSelectChange(field.key, option.value, $any($event.target).checked)" />
                                        <span>{{ option.label }}</span>
                                    </label>
                                </ng-container>
                            </ng-container>

                            <ng-template #noOptions>
                                <div class="multi-select-empty">Không có dữ liệu</div>
                            </ng-template>
                        </div>
                    </div>

                    <!-- Number Input -->
                    <input *ngSwitchCase="'number'" type="number" [id]="field.key" [placeholder]="'Nhập ' + field.label"
                        [(ngModel)]="filterValues[field.key]" />

                    <!-- Date Input -->
                    <input *ngSwitchCase="'date'" type="date" [id]="field.key" [(ngModel)]="filterValues[field.key]" />

                    <!-- Date Range Picker -->
                    <app-date-range-picker *ngSwitchCase="'date-range'" [label]="field.label"
                        [fromDate]="getDateRangeValue(field.key).fromDate"
                        [toDate]="getDateRangeValue(field.key).toDate"
                        (dateRangeChange)="onDateRangeChange(field.key, $event)">
                    </app-date-range-picker>
                </ng-container>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="filter-actions">
            <button class="btn btn-muted" type="button" (click)="triggerReset()">
                <i class="bi bi-x-circle"></i>
                Xóa bộ lọc
            </button>
            <button class="btn btn-primary" type="button" (click)="triggerSearch()">
                <i class="bi bi-search"></i>
                Tìm kiếm
            </button>
        </div>
    </div>
</section>
