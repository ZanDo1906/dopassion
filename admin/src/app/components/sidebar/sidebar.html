<aside class="sidebar">
    <div class="brand">
        <img class="brand-logo" src="/logo.png" alt="DoPassion logo" />
        <div class="brand-text">
            <div class="brand-name">DoPassion</div>
            <div class="brand-subtitle">Admin Dashboard</div>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-group">
            <a class="nav-item" routerLink="/report" routerLinkActive="active" [routerLinkActiveOptions]="routerLinkActiveOptions">
                <span class="nav-icon">
                    <i class="bi bi-bar-chart"></i>
                </span>
                <span class="nav-label">Báo cáo</span>
                <span class="nav-caret">▾</span>
            </a>
            <div class="nav-sub">
                <a class="nav-sub-item" routerLink="/report/student-report" routerLinkActive="active">Báo cáo học viên</a>
                <a class="nav-sub-item" routerLink="/report/debt-report" routerLinkActive="active">Báo cáo công nợ</a>
                <a class="nav-sub-item" routerLink="/report/revenue-report" routerLinkActive="active">Báo cáo doanh thu</a>
            </div>
        </div>

        <div class="nav-group">
            <a class="nav-item" routerLink="/users" routerLinkActive="active" [routerLinkActiveOptions]="routerLinkActiveOptions">
                <span class="nav-icon">
                    <i class="bi bi-people"></i>
                </span>
                <span class="nav-label">Quản lý người dùng</span>
                <span class="nav-caret">▾</span>
            </a>
            <div class="nav-sub">
                <a class="nav-sub-item" routerLink="/users/customer" routerLinkActive="active">Khách hàng</a>
                <a class="nav-sub-item" routerLink="/users/registration" routerLinkActive="active">Đăng ký</a>
                <a class="nav-sub-item" routerLink="/users/staff/staff" routerLinkActive="active">Nhân viên</a>
                <a class="nav-sub-item" routerLink="/users/staff/role" routerLinkActive="active">Vai trò</a>
            </div>
        </div>

        <div class="nav-group">
            <a class="nav-item" routerLink="/courses" routerLinkActive="active" [routerLinkActiveOptions]="routerLinkActiveOptions">
                <span class="nav-icon">
                    <i class="bi bi-journal-text"></i>
                </span>
                <span class="nav-label">Quản lý khóa học</span>
                <span class="nav-caret">▾</span>
            </a>
            <div class="nav-sub">
                <a class="nav-sub-item" routerLink="/courses/courses" routerLinkActive="active">Khóa học</a>
                <a class="nav-sub-item" routerLink="/courses/classes" routerLinkActive="active">Lớp học</a>
            </div>
        </div>

        <div class="nav-group">
            <a class="nav-item" routerLink="/interactions" routerLinkActive="active" [routerLinkActiveOptions]="routerLinkActiveOptions">
                <span class="nav-icon">
                    <i class="bi bi-chat-dots"></i>
                </span>
                <span class="nav-label">Quản lý tương tác</span>
                <span class="nav-caret">▾</span>
            </a>
            <div class="nav-sub">
                <a class="nav-sub-item" routerLink="/interactions/request" routerLinkActive="active">Yêu cầu</a>
                <a class="nav-sub-item" routerLink="/interactions/feedback" routerLinkActive="active">Phản hồi</a>
            </div>
        </div>

        <div class="nav-group">
            <a class="nav-item" routerLink="/accounting" routerLinkActive="active" [routerLinkActiveOptions]="routerLinkActiveOptions">
                <span class="nav-icon">
                    <i class="bi bi-cash-coin"></i>
                </span>
                <span class="nav-label">Kế toán</span>
                <span class="nav-caret">▾</span>
            </a>
            <div class="nav-sub">
                <a class="nav-sub-item" routerLink="/accounting/payment" routerLinkActive="active">Thanh toán</a>
                <a class="nav-sub-item" routerLink="/accounting/refund" routerLinkActive="active">Hoàn tiền</a>
                <a class="nav-sub-item" routerLink="/accounting/debt" routerLinkActive="active">Công nợ</a>
                <a class="nav-sub-item" routerLink="/accounting/voucher" routerLinkActive="active">Voucher</a>
            </div>
        </div>

        <a class="nav-item" routerLink="/setting" routerLinkActive="active">
            <span class="nav-icon">
                <i class="bi bi-gear"></i>
            </span>
            <span class="nav-label">Cấu hình</span>
        </a>

        <a class="nav-item logout-btn" (click)="logout()">
            <span class="nav-icon">
                <i class="bi bi-box-arrow-right"></i>
            </span>
            <span class="nav-label">Đăng xuất</span>
        </a>
    </nav>
</aside>
