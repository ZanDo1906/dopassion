<header class="topbar">
    <div class="topbar__left">
        <nav class="crumbs" aria-label="Đường dẫn">
            <span class="crumbs__home">
                <i class="bi bi-house-door-fill" aria-hidden="true"></i>
                <span>Trang chủ</span>
            </span>
            <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
                <span class="crumbs__sep" aria-hidden="true">
                    <i class="bi bi-chevron-right"></i>
                </span>
                <span class="crumbs__item" [class.crumbs__item--current]="last">{{ crumb.label }}</span>
            </ng-container>
        </nav>
    </div>

    <div class="topbar__right">
        <button class="icon-btn" type="button" aria-label="Thông báo">
            <span class="icon-btn__dot" aria-hidden="true"></span>
            <i class="bi bi-bell-fill" aria-hidden="true"></i>
        </button>

        <a class="user-chip" routerLink="/account" aria-label="Tài khoản">
            <div class="user-chip__avatar" aria-hidden="true">
                <img *ngIf="currentUserAvatar" [src]="currentUserAvatar" alt="Avatar">
                <i *ngIf="!currentUserAvatar" class="bi bi-person-fill" aria-hidden="true"></i>
            </div>
            <div class="user-chip__info">
                <div class="user-chip__name">
                    {{ currentUserName }}
                </div>

                <div class="user-chip__role">
                    {{ currentUserRole }}
                </div>
            </div>
        </a>
    </div>
</header>
