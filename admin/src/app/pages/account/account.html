<div class="account-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="profile-section">
      <img [src]="avatar" alt="Profile" class="profile-avatar">
      <h2 class="profile-name"> {{ tenNhanVien }}</h2>
      <p class="profile-date"> {{ updatedAt }}</p>
    </div>

    <!-- <nav class="menu"> 
      <ul>
        <li>
          <span class="menu-item active">
            <i class="bi bi-person-fill"></i> Thông tin cá nhân
          </span> 
        </li>
      </ul>
    </nav> -->

    <!-- <button class="logout-btn"><i class="bi bi-box-arrow-right"></i> Đăng xuất</button> -->
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="form-section">
      <h3 class="section-title">THÔNG TIN CÁ NHÂN</h3>
      <form class="info-form" (ngSubmit)="saveProfile()">
        <div class="form-row">
          <div class="form-group">
            <label for="fullname">Họ và tên</label>
            <input type="text" id="fullname" [(ngModel)]="tenNhanVien" name="tenNhanVien" [disabled]="!isEditMode">
          </div>
          <div class="form-group">
            <label for="phone">Số điện thoại</label>
            <input type="tel" id="phone" [(ngModel)]="sdt" name="sdt" [disabled]="!isEditMode">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="dob">Ngày sinh</label>
            <input type="date" id="dob" [(ngModel)]="ngaySinh" name="ngaySinh" [disabled]="!isEditMode">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" [disabled]="!isEditMode">
          </div>
        </div>
        <button *ngIf="!isEditMode" type="button" class="btn-save" (click)="enableEdit()">
          CHỈNH SỬA THÔNG TIN
        </button>

        <button *ngIf="isEditMode" type="submit" class="btn-save">
          LƯU THÔNG TIN
        </button>
      </form>
    </div>

    <div class="form-section">
      <div class="password-header">
        <h3 class="section-title password-toggle" (click)="showPasswordForm = !showPasswordForm">
          ĐỔI MẬT KHẨU
          <i class="bi" [ngClass]="showPasswordForm ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
        </h3>
      </div>

      <div *ngIf="showPasswordForm">
        <form class="password-form" (ngSubmit)="changePassword()">

          <div class="form-group">
            <label for="old-password">
              Mật khẩu cũ
              <span class="required">*</span>
            </label>

            <input type="password" id="old-password" [(ngModel)]="oldPassword" name="oldPassword"
              placeholder="••••••••">
          </div>

          <div class="form-group">
            <label for="new-password">
              Mật khẩu mới
              <span class="required">*</span>
            </label>

            <input type="password" id="new-password" [(ngModel)]="newPassword" name="newPassword"
              placeholder="••••••••">
          </div>

          <div class="form-group">
            <label for="confirm-password">
              Xác minh mật khẩu mới
              <span class="required">*</span>
            </label>

            <input type="password" id="confirm-password" [(ngModel)]="confirmPassword" name="confirmPassword"
              placeholder="••••••••">
          </div>

          <!-- ERROR -->
          <p *ngIf="passwordError" class="error-text">
            {{ passwordError }}
          </p>

          <!-- BUTTON -->
          <button type="submit" class="btn-save">
            LƯU MẬT KHẨU
          </button>

        </form>
      </div>
    </div>
  </div>
</div>
