<div class="permission-page">

    <div class="page-header">
        <div>
            <h2 style="color: #4C70AD;">Ma trận phân quyền</h2>
            <p>Vui lòng chọn Vai trò để phân quyền</p>
        </div>
    </div>

    <div class="filter-bar">

        <div class="filter-group">

            <label>Vai trò</label>

            <select [(ngModel)]="selectedRole">

                <option value="">
                    Chọn vai trò
                </option>

                <option
                    *ngFor="let role of roles"
                    [value]="role.maVaiTro">

                    {{ role.maVaiTro }} - {{ role.tenVaiTro }} 

                </option>

            </select>

        </div>

        <div class="action-group">

            <button
                class="search-btn"
                (click)="handleSearch()">

                Tìm kiếm

            </button>

            <button
                class="btn-save"
                (click)="savePermissions()">

                <i class="bi bi-floppy"></i>
                Lưu

            </button>

        </div>

    </div>

    <div
        class="permission-wrapper"
        *ngIf="searchedRole">

        <div class="role-info">

            <div class="role-name">
                {{ searchedRole.tenVaiTro }}
            </div>

            <div class="role-desc">
                {{ searchedRole.moTa }}
            </div>

        </div>

        <div class="table-wrapper">

            <table class="permission-table">

                <thead>
                    <tr>
                        <th>Chức năng</th>
                        <th>Thêm mới</th>
                        <th>Nhập Excel</th>
                        <th>Xuất Excel</th>
                        <th>Xem chi tiết</th>
                        <th>Chỉnh sửa</th>
                        <th>Thanh toán</th>
                        <th>Hoàn tiền</th>
                        <th>Khóa TK</th>
                    </tr>
                </thead>

                <tbody>

                    <tr
                        *ngFor="let item of permissionModules">

                        <td class="module-name">
                            {{ item.module }}
                        </td>

                        <td>
                            <input
                                type="checkbox"
                                [(ngModel)]="item.permissions.themMoi">
                        </td>

                        <td>
                            <input
                                *ngIf="item.permissions.nhapExcel !== undefined"
                                type="checkbox"
                                [(ngModel)]="item.permissions.nhapExcel">
                        </td>

                        <td>
                            <input
                                *ngIf="item.permissions.xuatExcel !== undefined"
                                type="checkbox"
                                [(ngModel)]="item.permissions.xuatExcel">
                        </td>

                        <td>
                            <input
                                *ngIf="item.permissions.xemChiTiet !== undefined"
                                type="checkbox"
                                [(ngModel)]="item.permissions.xemChiTiet">
                        </td>

                        <!-- <td>
                            <input
                                *ngIf="item.permissions.chinhSua !== undefined"
                                type="checkbox"
                                [(ngModel)]="item.permissions.chinhSua">
                        </td> -->

                        <td>
                            <input
                                *ngIf="item.permissions.an !== undefined"
                                type="checkbox"
                                [(ngModel)]="item.permissions.an">
                        </td>

                        <td>
                            <input
                                *ngIf="item.permissions.thanhToan !== undefined"
                                type="checkbox"
                                [(ngModel)]="item.permissions.thanhToan">
                        </td>

                        <td>
                            <input
                                *ngIf="item.permissions.hoanTien !== undefined"
                                type="checkbox"
                                [(ngModel)]="item.permissions.hoanTien">
                        </td>

                        <td>
                            <input
                                *ngIf="item.permissions.khoaTaiKhoan !== undefined"
                                type="checkbox"
                                [(ngModel)]="item.permissions.khoaTaiKhoan">
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
