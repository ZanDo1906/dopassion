<div class="role-page">
    <!-- Shared Filter Data Picker Component -->
    <app-filter-data-picker [config]="filterConfig" (onSearch)="handleSearch($event)"
        (onReset)="handleReset()"></app-filter-data-picker>

    <!-- Action Bar -->
    <div class="toolbar">
        <button class="btn btn-outline" type="button" (click)="openAddRoleDialog()">
            <i class="bi bi-plus-circle"></i>
            Thêm mới
        </button>
        <button class="btn btn-outline" type="button">
            <i class="bi bi-upload"></i>
            Xuất excel
        </button>
    </div>

    <!-- Data Table -->
    <div class="table-card">
        <table class="role-table">
            <thead>
                <tr>
                    <th class="col-stt">STT</th>
                    <th>Mã Vai trò</th>
                    <th>Tên Vai trò</th>
                    <th>Mô tả</th>
                    <th>Trạng thái</th>
                    <th class="col-actions">Tác vụ</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of paginatedData; let i = index">
                    <td>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</td>
                    <td>{{ item.maVaiTro }}</td>
                    <td>{{ item.tenVaiTro }}</td>
                    <td>{{ item.moTa }}</td>
                    <td>
                        <span class="badge" [ngClass]="{
                                'badge--success': item.active,
                                'badge--danger': !item.active
                            }">
                            {{ item.active ? 'Đang hoạt động' : 'Đã khóa' }}
                        </span>
                    </td>
                    <td>
                        <div class="action-group">
                            <button class="icon-btn" type="button" title="Xem chi tiết" (click)="viewRoleDetail(item)">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="icon-btn" type="button" [title]="isRoleLocked(item) ? 'Mở khóa' : 'Khóa'"
                                (click)="toggleLockStatus(item)">
                                <i [class]="isRoleLocked(item) ? 'bi bi-lock-fill' : 'bi bi-unlock'"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <app-pagination [totalItems]="filteredData.length" [currentPage]="currentPage" [itemsPerPage]="itemsPerPage"
        [pageSizeOptions]="pageSizeOptions" (pageChange)="onPaginationPageChange($event)"
        (pageSizeChange)="onPaginationPageSizeChange($event)"></app-pagination>
</div>

<ng-template #viewRoleTemplate>
    <form class="view-role-form" [formGroup]="detailForm">
        <div class="section">
            <div class="section-title">I. Thông tin vai trò</div>

            <div class="row role-view-row">
                <div class="col-md-6 role-view-col">
                    <div class="form-group">
                        <label>Mã vai trò</label>
                        <input class="form-control view-role-input" type="text" formControlName="maVaiTro" readonly />
                    </div>
                </div>

                <div class="col-md-6 role-view-col">
                    <div class="form-group">
                        <label>Tên vai trò</label>
                        <input class="form-control view-role-input" type="text" formControlName="tenVaiTro" readonly />
                    </div>
                </div>

                <div class="col-md-12 role-view-col">
                    <div class="form-group">
                        <label>Mô tả</label>
                        <textarea class="form-control view-role-textarea" rows="3" formControlName="moTa"
                            readonly></textarea>
                    </div>
                </div>

                <div class="col-md-6 role-view-col">
                    <div class="form-group">
                        <label>Trạng thái</label>
                        <div class="role-view-status-wrap">
                            <span class="badge" [ngClass]="{
                                    'badge--success': detailForm.get('active')?.value,
                                    'badge--danger': !detailForm.get('active')?.value
                                }">
                                {{ detailForm.get('active')?.value ? 'Đang hoạt động' : 'Đã khóa' }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<app-form-dialog *ngIf="isDialogOpen" [title]="isViewMode ? 'Chi tiết vai trò' : 'Thêm mới vai trò'"
    [sections]="isViewMode ? [] : dialogSections" [columns]="3" [formGroup]="isViewMode ? detailForm : addRoleForm"
    [bodyTemplate]="isViewMode ? viewRoleTemplate : null"
    [cancelText]="isViewMode ? viewDialogConfig.cancelText : 'Thoát'" submitText="Lưu" cancelIcon="bi bi-x-circle"
    submitIcon="bi bi-save" [class.view-only-dialog]="isViewMode && viewDialogConfig.hideSubmitButton"
    (close)="closeDialog()" (submit)="onSubmitAddRole($event)">
</app-form-dialog>

<app-confirm-dialog [isOpen]="isConfirmLockDialogOpen"
    [title]="isLockWarningOnly ? 'Không thể khóa vai trò' : (confirmLockItem && isRoleLocked(confirmLockItem) ? 'Mở khóa vai trò' : 'Khóa vai trò')"
    [message]="confirmLockMessage"
    [confirmText]="isLockWarningOnly ? 'Đã hiểu' : (confirmLockItem && isRoleLocked(confirmLockItem) ? 'Mở khóa' : 'Khóa')"
    [cancelText]="isLockWarningOnly ? 'Đóng' : 'Hủy'"
    [confirmIcon]="isLockWarningOnly ? 'bi bi-exclamation-triangle-fill' : (confirmLockItem && isRoleLocked(confirmLockItem) ? 'bi bi-unlock-fill' : 'bi bi-lock-fill')"
    cancelIcon="bi bi-x-circle"
    (confirm)="isLockWarningOnly ? onCancelLock() : onConfirmLock()"
    (cancel)="onCancelLock()">
</app-confirm-dialog>
