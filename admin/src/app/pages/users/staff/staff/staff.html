<div class="role-page">
    <!-- Shared Filter Data Picker Component -->
    <app-filter-data-picker
        [config]="filterConfig"
        (onSearch)="handleSearch($event)"
        (onReset)="handleReset()"
    ></app-filter-data-picker>

    <!-- Action Bar -->
    <div class="toolbar">
        <button class="btn btn-outline" type="button" (click)="openAddStaffDialog()">
            <i class="bi bi-plus-circle"></i>
            Thêm mới
        </button>
        <button class="btn btn-outline" type="button">
            <i class="bi bi-download"></i>
            Nhập excel
        </button>
        <button class="btn btn-outline" type="button">
            <i class="bi bi-upload"></i>
            Xuất excel
        </button>
    </div>

    <!-- Data Table -->
    <div class="table-card">
        <table class="role-table">
            <thead>
                <tr>
                    <th class="col-stt">STT</th>
                    <th>Mã nhân viên</th>
                    <th>Tên nhân viên</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th class="col-actions">Tác vụ</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let staff of paginatedData; let i = index">
                    <td>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</td>
                    <td>{{ staff.maNhanVien }}</td>
                    <td>{{ staff.tenNhanVien }}</td>
                    <td>{{ staff.vaiTro }}</td>
                    <td class="text-center">
                        <span 
                            class="badge"
                            [ngClass]="{
                                'badge--success': staff.trangThai === 'Đang hoạt động',
                                'badge--danger': staff.trangThai === 'Ngưng hoạt động'
                            }"
                        >
                            {{ staff.trangThai }}
                        </span>
                    </td>
                    <td>
                        <div class="action-group">
                            <button class="icon-btn" type="button" title="Xem chi tiết">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="icon-btn" type="button" title="Khóa/Mở khóa">
                                <i class="bi bi-slash-circle"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <app-pagination
        [totalItems]="filteredData.length"
        [currentPage]="currentPage"
        [itemsPerPage]="itemsPerPage"
        [pageSizeOptions]="pageSizeOptions"
        (pageChange)="onPaginationPageChange($event)"
        (pageSizeChange)="onPaginationPageSizeChange($event)"
    ></app-pagination>
</div>

<ng-template #addStaffTemplate>
    <form [formGroup]="addStaffForm" class="staff-add-form">
        <div class="section-title">I. Thông tin cá nhân</div>

        <div class="form-grid form-grid--three">
            <div class="form-group">
                <label>Mã Nhân viên</label>
                <input class="input-readonly" type="text" formControlName="employeeId" readonly />
            </div>
            <div class="form-group">
                <label><span class="required-star">*</span>Tên nhân viên</label>
                <input type="text" formControlName="fullName" />
            </div>
            <div class="form-group">
                <label><span class="required-star">*</span>Giới tính</label>
                <select formControlName="gender">
                    <option value="">Chọn giới tính</option>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>
        </div>

        <div class="form-grid form-grid--three">
            <div class="form-group">
                <label><span class="required-star">*</span>Ngày sinh</label>
                <input type="date" formControlName="dob" />
            </div>
            <div class="form-group">
                <label>Địa chỉ</label>
                <input type="text" formControlName="address" />
            </div>
            <div class="form-group">
                <label><span class="required-star">*</span>SĐT</label>
                <input type="text" formControlName="phone" />
            </div>
        </div>

        <div class="section-title">II. Thông tin nhân viên</div>

        <div class="form-grid form-grid--three">
            <div class="form-group">
                <label><span class="required-star">*</span>Chi nhánh</label>
                <select formControlName="branch">
                    <option value="">Chọn chi nhánh</option>
                    <option *ngFor="let item of branchOptions" [value]="item.value">{{ item.label }}</option>
                </select>
            </div>
            <div class="form-group">
                <label><span class="required-star">*</span>Vai trò</label>
                <select formControlName="roleName">
                    <option value="">Chọn vai trò</option>
                    <option *ngFor="let item of roleOptions" [value]="item.value">{{ item.label }}</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mã Vai trò</label>
                <input class="input-readonly" type="text" formControlName="roleId" readonly />
            </div>
        </div>

        <div class="form-group cccd-upload-group">
            <label><span class="required-star">*</span>Ảnh CCCD</label>
            <label class="upload-box" for="cccd-upload-input">
                <span class="upload-box__text">+ Upload</span>
            </label>
            <input id="cccd-upload-input" type="file" accept="image/*" class="upload-input" (change)="onCccdFileChange($event)" />
            <small class="upload-file-name" *ngIf="addStaffForm.get('cccdImage')?.value">{{ addStaffForm.get('cccdImage')?.value }}</small>
        </div>
    </form>
</ng-template>

<app-form-dialog
    *ngIf="isAddStaffDialogOpen"
    title="Thêm mới nhân viên"
    [bodyTemplate]="addStaffTemplate"
    cancelText="Thoát"
    submitText="Lưu"
    cancelIcon="bi bi-x-circle"
    submitIcon="bi bi-save"
    (close)="closeAddStaffDialog()"
    (submit)="onSubmitAddStaff()">
</app-form-dialog>
