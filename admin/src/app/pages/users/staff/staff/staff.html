<div class="role-page">
    <!-- Shared Filter Data Picker Component -->
    <app-filter-data-picker
        [config]="filterConfig"
        (onSearch)="handleSearch($event)"
        (onReset)="handleReset()"
    ></app-filter-data-picker>

    <!-- Action Bar -->
    <div class="toolbar">
        <button class="btn btn-outline" type="button">
            <i class="bi bi-plus-circle"></i>
            Thêm mới
        </button>
        <button class="btn btn-outline" type="button">
            <i class="bi bi-download"></i>
            Nhập excel
        </button>
        <button class="btn btn-outline" type="button">
            <i class="bi bi-upload"></i>
            Xuất excel
        </button>
    </div>

    <!-- Data Table -->
    <div class="table-card">
        <table class="role-table">
            <thead>
                <tr>
                    <th class="col-stt">STT</th>
                    <th>Mã nhân viên</th>
                    <th>Tên nhân viên</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th class="col-actions">Tác vụ</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let staff of paginatedData; let i = index">
                    <td>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</td>
                    <td>{{ staff.maNhanVien }}</td>
                    <td>{{ staff.tenNhanVien }}</td>
                    <td>{{ staff.vaiTro }}</td>
                    <td class="text-center">
                        <span 
                            class="badge"
                            [ngClass]="{
                                'badge--success': staff.trangThai === 'Đang hoạt động',
                                'badge--danger': staff.trangThai === 'Ngưng hoạt động'
                            }"
                        >
                            {{ staff.trangThai }}
                        </span>
                    </td>
                    <td>
                        <div class="action-group">
                            <button class="icon-btn" type="button" title="Xem chi tiết">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="icon-btn" type="button" title="Khóa/Mở khóa">
                                <i class="bi bi-slash-circle"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <app-pagination
        [totalItems]="filteredData.length"
        [currentPage]="currentPage"
        [itemsPerPage]="itemsPerPage"
        [pageSizeOptions]="pageSizeOptions"
        (pageChange)="onPaginationPageChange($event)"
        (pageSizeChange)="onPaginationPageSizeChange($event)"
    ></app-pagination>
</div>
