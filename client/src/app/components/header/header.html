<header class="header navbar-glass">
    <div class="header-container">
        <!-- Logo -->
        <div class="logo">
            <img src="/logo.png" alt="DoPassion Logo" class="logo-img" />
        </div>

        <!-- Navigation Menu -->
        <nav class="nav-menu nav-pill" #navMenu>
            <div class="nav-indicator"></div>

            <a
                [routerLink]="['/home']"
                class="nav-item nav-item-link"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                #rlaHome="routerLinkActive"
                [class.active]="rlaHome.isActive"
            >
                Giới thiệu
            </a>

            <a
                routerLink="/classes"
                class="nav-item nav-item-link"
                routerLinkActive="active"
            >
                Lớp học
            </a>

            <a
                routerLink="/contact"
                class="nav-item nav-item-link"
                routerLinkActive="active"
            >
                Liên hệ
            </a>

            <a
                routerLink="/reviews"
                class="nav-item nav-item-link"
                routerLinkActive="active"
            >
                Đánh giá
            </a>

        </nav>

        <!-- Right Section -->
        <div class="header-right">
            <!-- Help Icon -->
            <button class="icon-btn help-btn" title="Trợ giúp">
                <i class="bi bi-question-circle"></i>
            </button>

            <!-- Notification Icon -->
            <button class="icon-btn notification-btn" title="Thông báo">
                <i class="bi bi-bell"></i>
            </button>

            <!-- Avatar -->
            <div class="avatar" (click)="onAvatarClick()">

                <!-- Có avatar -->
                <img
                    *ngIf="avatarUrl"
                    [src]="avatarUrl"
                    alt="User Avatar"
                    class="avatar-img"
                />

                <!-- Không có avatar -->
                <div
                    *ngIf="!avatarUrl"
                    class="avatar-default"
                >

                    <i
                        class="bi"
                        [ngClass]="
                            gender === 'Nữ'
                            ? 'bi-person-fill'
                            : 'bi-person-fill'
                        "
                    ></i>

                </div>

            </div>
        </div>
    </div>
</header>
