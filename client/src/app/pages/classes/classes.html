<div class="classes-container">
  <!-- Header banner Section -->
  <div class="classes-header">
    <img src="/banner.png" alt="DoPassion banner" class="banner-image" />
    <div class="header-overlay">
    </div>
  </div>

  <!-- Filter Section -->
  <div class="filter-section">
    <div class="filter-group">
      <label class="filter-label">Khóa học</label>
      <select class="filter-select filter-select-main" (change)="filterByCourse($event)">
        <option value="">Tất cả khóa học</option>
        <option value="LR">TOEIC - LR</option>
        <option value="SW">TOEIC - SW</option>
      </select>
    </div>

    <div class="filter-group">
      <app-date-range-picker
        [label]="'KHOẢNG THỜI GIAN KHAI GIẢNG'"
        [fromDate]="currentFilters.startDate || ''"
        [toDate]="currentFilters.endDate || ''"
        [minDate]="'2026-01-01'"
        (dateRangeChange)="onDateRangeChange($event)"
      ></app-date-range-picker>
    </div>

    <div class="filter-group">
      <label class="filter-label">Chi nhánh</label>
      <select class="filter-select filter-select-main" (change)="filterByBranch($event)">
        <option value="">Tất cả chi nhánh</option>
        <option value="Hà Nội">Hà Nội</option>
        <option value="TP. HCM">TP. HCM</option>
        <option value="Đà Nẵng">Đà Nẵng</option>
      </select>
    </div>

    <div class="filter-group search-group d-flex flex-row gap-2 align-items-end">
      <button class="search-btn" (click)="onSearch()" title="Tìm kiếm">
        <i class="bi bi-search me-1"></i>
      </button>
      <button class="reset-btn" (click)="resetFilters()" title="Xóa bộ lọc">
        <i class="bi bi-arrow-counterclockwise"></i>
      </button>
    </div>
  </div>

  <!-- Result Count -->
  <div class="result-count-container" *ngIf="courses.length > 0">
    <span class="text-muted fst-italic result-count">Tìm thấy {{ courses.length }} khóa học phù hợp.</span>
  </div>

  <!-- Courses Grid -->
  <div class="courses-grid" *ngIf="courses && courses.length > 0">
    <div *ngFor="let course of courses" class="course-card">
      <div class="course-image">
        <img src="/sample.png" alt="{{ course.title }}" />
      </div>
      <div class="course-content">
        <h3 class="course-title">{{ course.title }}</h3>

        <div class="course-info-row">
          <span class="info-badge"><i class="bi bi-calendar-event me-1"></i>{{ formatDate(course.startDate) }}</span>
          <span class="info-badge"><i class="bi bi-geo-alt-fill text-danger me-1"></i>{{ course.branch }}</span>
        </div>

        <div class="course-rating">
        </div>

        <div class="course-meta">
          <div class="meta-item">
            <span class="meta-label">Giờ học</span>
            <span class="meta-value">{{ course.schedule }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Số buổi</span>
            <span class="meta-value">{{ course.lessons }}</span>
          </div>
        </div>

        <button class="view-details-btn">Xem chi tiết</button>

        <div class="checkbox-item">
          <span class="check-icon" [class.checked]="course.hasTest"><i class="bi bi-check-circle-fill text-success"></i></span>
          <label>Kiểm tra đầu vào</label>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!courses || courses.length === 0">
    <div class="empty-state-content">
      <i class="bi bi-search empty-state-icon"></i>
      <h5 class="empty-state-title">Không tìm thấy khóa học nào</h5>
      <p class="empty-state-text text-muted">Vui lòng điều chỉnh lại điều kiện lọc hoặc xóa bộ lọc.</p>
      <button class="btn btn-outline-primary mt-3" (click)="resetFilters()">
        <i class="bi bi-arrow-counterclockwise me-2"></i>Xóa bộ lọc
      </button>
    </div>
  </div>
</div>
