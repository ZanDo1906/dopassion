<!-- USER LOGIN SECTION -->
<section class="user-login-section">
  <div class="login-overlay"></div>

  <div class="container-fluid h-100">
    <div class="row h-100">

      <!-- LEFT -->
      <div class="col-lg-6 left-panel d-none d-lg-flex">
        <div class="left-content">

          <img 
            src="../../../assets/logo.png" 
            alt="Logo"
            class="login-logo"
          >

          <h1>Hệ Thống Đăng ký lớp học</h1>

          <h2>Trung Tâm Anh Ngữ DoPassion</h2>

          <p>
            Chuyên cung cấp các lớp học Toeic 4 kỹ năng<br>
            Speaking, Listening, Reading, Writing
          </p>

        </div>
      </div>

      <!-- RIGHT -->
      <div class="col-lg-6 right-panel">
        <div class="login-card">

          <h3>Đăng nhập</h3>

          <p class="login-subtitle">
            Chào mừng quay trở lại! Vui lòng đăng nhập vào tài khoản của bạn.
          </p>

          <form>

            <!-- EMAIL -->
            <div class="form-group">
              <label>Email/SĐT</label>

              <div class="input-group-custom">
                <i class="bi bi-person"></i>

                <input
                  type="text"
                  placeholder="Nhập email hoặc số điện thoại"
                  [(ngModel)]="loginValue"
                  name="loginValue"
                >
              </div>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
              <label>Mật khẩu</label>

              <div class="input-group-custom">
                <i class="bi bi-lock"></i>

                <input
                  type="password"
                  placeholder="Nhập mật khẩu"
                  [(ngModel)]="password"
                  name="password"
                >

                <button type="button" class="toggle-password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- OPTIONS -->
            <div class="login-options">

              <label class="remember-me">
                <input type="checkbox">
                <span>Ghi nhớ đăng nhập</span>
              </label>

              <a href="#" class="forgot-password">
                Quên mật khẩu?
              </a>

            </div>

            <!-- LOGIN BTN -->
            <button class="btn-login" type="button" (click)="onLogin()">
              <i class="bi bi-box-arrow-in-right"></i>
              Đăng nhập
            </button>

            <!-- GOOGLE -->
            <button class="btn-google" type="button" >
              <img
                src="https://www.svgrepo.com/show/475656/google-color.svg"
                alt="Google"
              >
              Đăng nhập với Google
            </button>

          </form>

          <div class="bottom-text">
            Chưa có tài khoản?
            <a href="#">Đăng ký ngay</a>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
